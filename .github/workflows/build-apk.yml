name: Build Football Manager APK

# Dispara automaticamente quando qualquer arquivo for alterado e commitado,
# tanto em push direto quanto via merge de Pull Request.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Generate Android project structure
      run: flutter create --platforms=android --project-name football_manager_br .

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: football-manager-br-release
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 14
