name: Build Football Manager APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      # O projeto já traz a pasta android/. Se ela for apagada, é recriada aqui.
      - name: Generate Android project (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org br.com.fmbr --project-name football_manager_br .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-manager-br-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
