name: football_manager_br
description: Jogo de gerenciamento de futebol estilo Brasfoot - temporada 2026.
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# As versões novas destes plugins usam JNI (biblioteca nativa libdartjni),
# que falha no Moto E22: o save e o som paravam de funcionar.
# Ficamos nas últimas versões que usam o canal tradicional do Flutter.
dependency_overrides:
  shared_preferences_android: 2.4.28
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
